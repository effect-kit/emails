name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Version PRs from GITHUB_TOKEN are verified after merge and again before publishing.
    if: >-
      !(github.event_name == 'pull_request' &&
        github.actor == 'github-actions[bot]' &&
        github.event.pull_request.head.ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24.22.0", "24.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm verify
      - name: Verify the beta compiler consumer boundary
        if: matrix.node == '24.x'
        run: pnpm test:consumer -- --fixture react-resend --typescript 7.1.0-beta
